[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-ptt-controller"
version = "1.0.0"
description = "MIDI pedal to ham radio PTT controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "mido>=1.3",
  "python-rtmidi>=1.5",
  "pyserial>=3.5",
]

[project.scripts]
midi-ptt-controller = "midi_ptt_controller.main:main"

[tool.setuptools]
packages = ["midi_ptt_controller"]

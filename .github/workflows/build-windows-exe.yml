name: Build Windows executable

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file GUI executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name MIDI-PTT-Controller
          --paths .
          --collect-all mido
          --collect-all rtmidi
          run_app.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/MIDI-PTT-Controller.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-PTT-Controller-windows
          path: dist/MIDI-PTT-Controller.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MIDI-PTT-Controller.exe
          generate_release_notes: true
